# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    nodejs: "22"
  jobs:
    post_checkout:
      # sphinx-last-updated-by-git reads page dates from the full history.
      - git fetch --unshallow || true
    pre_install:
      # Installing the theme from source compiles its CSS and JS with pnpm.
      - npm install -g pnpm@10
    post_install:
      - pnpm install --frozen-lockfile
      - pnpm run build

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - dev
