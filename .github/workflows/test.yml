name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          install-deps: "false"

      - name: Check uv lockfile
        run: uv lock --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Ruff check
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: djlint check
        run: uv run --locked djlint src/sphinx_lumina_theme/theme/ --check

  test-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        sphinx: ["8", "9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}

      - name: Override Sphinx version
        run: uv pip install "sphinx~=${{ matrix.sphinx }}.0"

      - name: Build assets
        run: pnpm run build

      - name: Run structure tests
        run: uv run --no-sync pytest tests/ --ignore=tests/test_browser.py -v

  test-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build assets
        run: pnpm run build

      - name: Build docs with all extensions (warnings as errors)
        run: uv run --locked sphinx-build docs docs/_build/html -W

      - name: Verify key output files
        run: |
          test -f docs/_build/html/index.html
          test -f docs/_build/html/getting-started/installation.html

      - name: Run extension tests
        run: uv run --locked pytest tests/test_extensions.py -v

  test-browser:
    needs: test-structure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: uv run --locked playwright install --with-deps chromium firefox webkit

      - name: Build assets
        run: pnpm run build

      - name: Run browser tests
        run: uv run --locked pytest tests/test_browser.py -v --browser chromium --browser firefox --browser webkit
