name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          install-deps: "false"

      - name: Check uv lockfile
        run: uv lock --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Ruff check
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: djlint check
        run: uv run --locked djlint src/sphinx_lumina_theme/theme/ --check

  test-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        sphinx: ["8", "9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}

      - name: Override Sphinx version
        run: uv pip install "sphinx~=${{ matrix.sphinx }}.0"

      - name: Build assets
        run: pnpm run build

      - name: Run structure tests
        run: uv run --no-sync pytest tests/ --ignore=tests/test_browser.py --ignore=tests/test_http_api_browser.py -v

  test-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build assets
        run: pnpm run build

      - name: Build docs with all extensions (warnings as errors)
        run: uv run --locked sphinx-build docs docs/_build/html -W

      - name: Verify key output files
        run: |
          test -f docs/_build/html/index.html
          test -f docs/_build/html/getting-started/installation.html

      - name: Run extension tests
        run: uv run --locked pytest tests/test_extensions.py -v

  # The PR run already tested the merge result; pushes to main would repeat it.
  test-browser-engine:
    name: test-browser (${{ matrix.browser }})
    needs: test-structure
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Browser builds depend on the OS image and on the Playwright version pinned in uv.lock.
      - name: Read runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ matrix.browser }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run --locked playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run --locked playwright install-deps ${{ matrix.browser }}

      - name: Build assets
        run: pnpm run build

      - name: Run browser tests
        run: uv run --locked pytest tests/test_browser.py tests/test_http_api_browser.py -v --browser ${{ matrix.browser }}

  # Required status check; a skipped required job would count as passing.
  test-browser:
    needs: test-browser-engine
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-browser-engine.result }}" = success
