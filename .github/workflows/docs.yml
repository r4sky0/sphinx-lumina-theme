name: Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/sphinx_lumina_theme/theme/**'
      - 'src/sphinx_lumina_theme/_static_src/**'
      - 'scripts/build-assets.js'
      - 'tailwind.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build assets
        run: pnpm run build

      - name: Build documentation
        run: uv run --locked sphinx-build docs docs/_build/html -W

      - uses: ./.github/actions/deploy-gh-pages
        with:
          source-dir: docs/_build/html
          commit-message: "Deploy documentation from ${GITHUB_SHA::7}"
