name: PR Preview Deploy

on:
  workflow_run:
    workflows: [PR Preview Build]
    types: [completed]

permissions: {}

jobs:
  deploy-preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # This workflow is trusted. The downloaded artifact is treated as data;
      # no code from the pull request is executed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download preview artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview
          path: preview-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read preview event
        id: preview
        shell: bash
        env:
          ARTIFACT_DIR: preview-artifact
          GH_TOKEN: ${{ github.token }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          action="$(cat "$ARTIFACT_DIR/lumina-preview-event.txt")"
          pr="$(cat "$ARTIFACT_DIR/lumina-preview-pr.txt")"
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $pr" >&2
            exit 1
          fi
          case "$action" in
            opened|synchronize|reopened)
              test -f "$ARTIFACT_DIR/index.html"
              # Only deploy previews for branches GitHub ties to this PR.
              if [ "$pr" = "$RUN_PR" ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            closed)
              # The artifact comes from PR code, so confirm the PR is really closed.
              state="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
              if [ "$state" != "OPEN" ]; then
                echo "cleanup=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Unsupported preview event: $action" >&2
              exit 1
              ;;
          esac
          rm "$ARTIFACT_DIR/lumina-preview-event.txt" "$ARTIFACT_DIR/lumina-preview-pr.txt"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        if: steps.preview.outputs.deploy == 'true'
        uses: ./.github/actions/deploy-gh-pages
        with:
          source-dir: preview-artifact
          target-dir: pr-${{ steps.preview.outputs.pr }}
          commit-message: "Deploy PR #${{ steps.preview.outputs.pr }} preview"

      - name: Remove closed preview
        if: steps.preview.outputs.cleanup == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.preview.outputs.pr }}
        run: |
          if ! git fetch origin gh-pages:gh-pages 2>/dev/null; then
            echo "gh-pages does not exist; nothing to clean up."
            exit 0
          fi

          git worktree add gh-pages-cleanup gh-pages
          trap 'git worktree remove --force gh-pages-cleanup' EXIT

          pr_dir="gh-pages-cleanup/pr-${PR_NUMBER}"
          if [ -d "$pr_dir" ]; then
            git -C gh-pages-cleanup config user.name "github-actions[bot]"
            git -C gh-pages-cleanup config user.email "github-actions[bot]@users.noreply.github.com"
            rm -rf -- "$pr_dir"
            git -C gh-pages-cleanup add -A
            if ! git -C gh-pages-cleanup diff --cached --quiet; then
              git -C gh-pages-cleanup commit -m "Clean up PR #${PR_NUMBER} preview"
              git -C gh-pages-cleanup push origin gh-pages
            fi
          fi

      - name: Comment on PR
        if: steps.preview.outputs.deploy == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.preview.outputs.pr }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- lumina-preview -->';
            const previewUrl = `https://${owner}.github.io/${repo}/pr-${prNumber}/`;
            const body = `${marker}\n📖 **Preview ready:** ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber,
            });

            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
            }
