name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build assets
        run: pnpm run build

      - name: Build docs
        env:
          PREVIEW_BASEURL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
        run: uv run --locked sphinx-build -D html_baseurl="$PREVIEW_BASEURL" docs docs/_build/html -W

      - name: Record preview event
        env:
          PREVIEW_ACTION: ${{ github.event.action }}
        run: echo "$PREVIEW_ACTION" > docs/_build/html/lumina-preview-event.txt

      - name: Upload preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 1

  record-closed:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record closed event
        env:
          PREVIEW_ACTION: ${{ github.event.action }}
        run: echo "$PREVIEW_ACTION" > lumina-preview-event.txt

      - name: Upload cleanup marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview
          path: lumina-preview-event.txt
          if-no-files-found: error
          retention-days: 1
