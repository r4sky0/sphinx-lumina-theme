version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to sphinxcontrib-mermaid's default mermaid_version (see test_extensions.py).
      - dependency-name: mermaid
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      uv-major:
        patterns:
          - "*"
        update-types:
          - major
