{% if toc %}
    <div class="lumina-toc-container sticky top-[var(--lumina-header-offset)] hidden h-[calc(100vh-var(--lumina-header-offset))] w-[220px] shrink-0 py-6 pr-4 xl:block">
        <p class="mb-3 text-xs font-semibold uppercase tracking-wider text-lumina-text-muted">On this page</p>
        <div class="lumina-toc-scroll">
            {# Alpine auto-invokes ``init()`` on x-data components — adding
               x-init="init()" here would run it twice and leak observers. #}
            <nav class="lumina-toc-nav"
                 aria-label="Table of contents"
                 x-data="scrollspy()">
                {{ toc }}
            </nav>
        </div>
    </div>
{% endif %}
