{% if announcement_content is defined and announcement_content %}
    <div id="lumina-announcement"
         x-data="announcementBanner()"
         data-announcement-id="{{ announcement_id }}"
         role="region"
         aria-label="{{ _('Site announcement') }}"
         class="bg-lumina-accent-light text-lumina-text text-center text-sm border-b border-lumina-border">
        <div class="mx-auto flex max-w-[90rem] items-center justify-center gap-4 px-4 py-1">
            <div class="flex-1 [&_a]:underline [&_a]:font-medium [&_a]:text-[var(--lumina-link)]">
                {{ announcement_content }}
            </div>
            <button @click="dismiss()"
                    class="grid size-8 shrink-0 place-items-center rounded-md text-lumina-text-muted hover:text-lumina-text hover:bg-[color-mix(in_srgb,var(--lumina-text)_8%,transparent)] transition-colors cursor-pointer"
                    aria-label="{{ _('Dismiss announcement') }}"
                    type="button">{{ lumina_icon("x", size=16) }}</button>
        </div>
    </div>
    {# Reserve wrapped banner height before the page content can paint. #}
    <script>
document.documentElement.style.setProperty(
  '--lumina-announcement-height',
  document.getElementById('lumina-announcement').getBoundingClientRect().height + 'px'
);
    </script>
{% endif %}
